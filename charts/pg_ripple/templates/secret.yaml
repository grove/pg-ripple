{{- $secretName := printf "%s-secret" (include "pg-ripple.fullname" .) -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName -}}
{{- $password := .Values.postgres.password | default "" -}}
{{- if and (not $password) $existing -}}
{{- $password = (index $existing.data "postgres-password" | b64dec) -}}
{{- end -}}
{{- if not $password -}}
{{- $password = randAlphaNum 32 -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  labels:
    {{- include "pg-ripple.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ $password | b64enc | quote }}
