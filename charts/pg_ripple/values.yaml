# pg_ripple Helm chart — default values (v0.132.0)
# Override any of these in your values.yaml or via --set on the command line.

# -- Number of PostgreSQL replica Pods.
replicaCount: 1

image:
  # -- Batteries-included image (pg_ripple + PostGIS + pgvector).
  repository: ghcr.io/trickle-labs/pg-ripple
  # -- Pin to an explicit release tag. Never use "latest" in production.
  tag: "0.132.0"
  pullPolicy: IfNotPresent

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  fsGroup: 999   # postgres GID

securityContext:
  runAsNonRoot: true
  runAsUser: 999   # postgres UID
  allowPrivilegeEscalation: false

# ── PostgreSQL configuration ──────────────────────────────────────────────────
postgres:
  # -- PostgreSQL superuser password (stored as a Secret). Leave empty to
  #    generate one on install; an existing generated Secret is preserved on upgrade.
  password: ""
  # -- Database to create on first start.
  database: "postgres"
  # -- Extra postgresql.conf options.
  extraConf:
    allow_system_table_mods: "on"
    shared_preload_libraries: "pg_ripple"

# ── Persistence ───────────────────────────────────────────────────────────────
persistence:
  enabled: true
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 10Gi
  annotations: {}

# ── Services ──────────────────────────────────────────────────────────────────
service:
  # -- PostgreSQL service type.
  type: ClusterIP
  port: 5432

http:
  enabled: true
  # -- Runtime mode. Production rejects the unauthenticated development override.
  mode: production
  image:
    # -- pg_ripple_http sidecar image.  Defaults to the same batteries-included
    #    image as the PostgreSQL container (tag must match the extension version).
    #    Override to use a standalone pg_ripple_http build.
    # -- Pin to an explicit release tag. Never use "latest" in production.
    repository: ghcr.io/trickle-labs/pg-ripple
    tag: "0.132.0"
    pullPolicy: IfNotPresent
  service:
    # -- SPARQL HTTP service type. Use LoadBalancer to expose externally.
    type: ClusterIP
    port: 7878
  # -- Name and key of an existing Secret containing the HTTP bearer token.
  #    Required unless allowUnauthenticated is true for local development.
  authTokenSecret:
    name: ""
    key: "auth-token"
  writeTokenSecret:
    name: ""
    key: "write-token"
  adminTokenSecret:
    name: ""
    key: "admin-token"
  metricsTokenSecret:
    name: ""
    key: "metrics-token"
  # -- Set to true only for local development. Production requires authTokenSecret.
  allowUnauthenticated: false
  # -- Requests per second per client IP.
  rateLimit: 100
  # -- Comma-separated CORS allowlist. Empty disables cross-origin access.
  corsOrigins: ""
  # -- Extra environment variables for the pg_ripple_http sidecar.
  env: {}
  securityContext:
    runAsNonRoot: true
    runAsUser: 65532
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]

# -- Optional pod ingress/egress policy. Keep egress denied by default and add
# explicit destinations when federation or LLM calls are enabled.
networkPolicy:
  enabled: false
  ingress: []
  egress: []

# ── pg_ripple GUC configuration ───────────────────────────────────────────────
ripple:
  # -- SPARQL Federation endpoints (list of {name, url} objects).
  federationEndpoints: []
  # -- ConfigMap name containing SHACL shapes (optional).
  shacl:
    shapesConfigMap: ""
  # -- Secret name containing the LLM API key (optional).
  llm:
    apiKeySecret: ""
    apiKeySecretKey: "api-key"

# ── Liveness and readiness probes ────────────────────────────────────────────
# M16-09 (v0.115.0): Use HTTP probes against the pg_ripple_http companion.
# /health — liveness: HTTP 200 when the process is alive and the DB is reachable.
# /ready  — readiness: HTTP 200 when the server has completed its startup
#           and obtained a connection from the pool (safe to receive traffic).
livenessProbe:
  httpGet:
    path: /health
    port: 7878
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 6

readinessProbe:
  httpGet:
    path: /ready
    port: 7878
  initialDelaySeconds: 5
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

# ── Resources ─────────────────────────────────────────────────────────────────
resources: {}
#  requests:
#    cpu: "500m"
#    memory: "512Mi"
#  limits:
#    cpu: "2"
#    memory: "2Gi"

# ── Node scheduling ───────────────────────────────────────────────────────────
nodeSelector: {}
tolerations: []
affinity: {}

# ── Prometheus monitoring ─────────────────────────────────────────────────────
metrics:
  enabled: false
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: "30s"

# ── PodDisruptionBudget (Feature 9, v0.120.0) ────────────────────────────────
# Ensures at least `minAvailable` pg_ripple pods remain available during
# voluntary disruptions (node drains, Kubernetes upgrades, etc.).
# Set enabled: true and minAvailable: 1 for single-replica deployments,
# or minAvailable: 2 for HA deployments with 3+ replicas.
podDisruptionBudget:
  enabled: true
  # -- Minimum number of available pods during disruptions.
  minAvailable: 1
  # -- Alternative: maximum unavailable pods. Leave empty to use minAvailable.
  maxUnavailable: ""
